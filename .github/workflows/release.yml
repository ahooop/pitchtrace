name: Release

# 打 tag（v1.2.3）即自动打包并发布到 GitHub Releases；
# 也可以在 Actions 页面手动触发，填一个版本号。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，不带 v 前缀，例如 0.1.1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          case "$VERSION" in
            ''|*[!0-9.]*)
              echo "::error::版本号不合法：'$VERSION'，只允许数字和点"
              exit 1
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "PITCHTRACE_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "PITCHTRACE_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      # 有 secrets 就签名；没有就继续产出未签名 APK，不把 CI 卡死在缺配置上。
      - name: Configure signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 RELEASE_KEYSTORE_BASE64，本次产出未签名 APK，无法直接安装"
            exit 0
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APK
        id: apk
        run: |
          set -euo pipefail
          SRC="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          if [ -z "$SRC" ]; then
            echo "::error::没有找到 release APK"
            exit 1
          fi
          mkdir -p dist
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            NAME="pitchtrace-${{ steps.version.outputs.version }}.apk"
          else
            NAME="pitchtrace-${{ steps.version.outputs.version }}-unsigned.apk"
          fi
          cp "$SRC" "dist/$NAME"
          ls -lh dist
          echo "path=dist/$NAME" >> "$GITHUB_OUTPUT"

      - name: Compose release notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "## PitchTrace $VERSION"
            echo
            echo "Android 8.0+（minSdk 26），来源提交 \`${GITHUB_SHA:0:7}\`。"
            if [ "${{ steps.signing.outputs.signed }}" != "true" ]; then
              echo
              echo "> ⚠️ 本次构建未签名，无法直接安装到手机，仅用于验证构建产物。"
            fi
            echo
            echo "### 变更"
            echo
            PREV_TAG="$(git tag --sort=-v:refname | grep -vxF "v${VERSION}" | head -n 1 || true)"
            if [ -n "$PREV_TAG" ]; then
              echo "自 \`$PREV_TAG\` 起："
              echo
              git log "$PREV_TAG..HEAD" --pretty='- %s (%h)'
            else
              git log -n 20 --pretty='- %s (%h)'
            fi
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: PitchTrace ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pitchtrace-release-${{ steps.version.outputs.version }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
